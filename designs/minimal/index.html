<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>Fieldnotes — a week of lessons</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ed;
      --paper-light: #fbfaf6;
      --ink: #20231f;
      --muted: #75796f;
      --line: #deded5;
      --green: #355d49;
      --green-soft: #e8ede7;
      --error: #9c3e32;
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
    }

    button, input, select { font: inherit; }
    a { color: inherit; }

    button, input, select, a { accent-color: var(--green); }

    :focus-visible {
      outline: 3px solid #76927d;
      outline-offset: 3px;
    }

    .page {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 21px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 650;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: white;
      font: 17px var(--serif);
    }

    .return-link {
      color: var(--green);
      font-size: 12px;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    main { padding: 43px 0 64px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { overflow-wrap: anywhere; }

    h1 {
      margin: 0;
      font: 400 clamp(34px, 5vw, 52px)/1.08 var(--serif);
    }

    .intro {
      max-width: 650px;
      margin: 12px 0 0;
      color: #62665e;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) minmax(280px, 1.25fr) auto;
      align-items: end;
      gap: 18px;
      margin: 30px 0 0;
      padding: 17px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    label, .field-label {
      display: block;
      margin-bottom: 5px;
      color: #555a52;
      font-size: 11px;
      font-weight: 650;
    }

    select, input[type="text"], input[type="date"] {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid #c9cbc1;
      border-radius: 3px;
      background: var(--paper-light);
      color: var(--ink);
    }

    .add-fields {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) minmax(145px, .7fr);
      gap: 10px;
    }

    .add-button, .delete-button {
      min-height: 42px;
      padding: 8px 13px;
      border: 1px solid var(--green);
      border-radius: 3px;
      background: var(--green);
      color: white;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .add-button:hover { background: #294b39; }

    .delete-button {
      border-color: #b6aaa0;
      background: transparent;
      color: #73483d;
    }

    .delete-button:hover { background: #f1e9e3; }

    .library-tools {
      display: flex;
      align-items: end;
      gap: 8px;
    }

    .library-tools > div { flex: 1; min-width: 0; }

    .disclosure {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .workspace { margin-top: 32px; }

    .workspace-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .workspace-heading h2 {
      margin: 0;
      font: 400 24px/1.2 var(--serif);
    }

    .progress { color: var(--muted); font-size: 11px; }

    .lesson-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(280px, .82fr);
      align-items: start;
      gap: 35px;
    }

    .lesson-list {
      margin: 0;
      padding: 0;
      border-top: 1px solid var(--line);
      list-style: none;
    }

    .lesson-row {
      display: grid;
      grid-template-columns: 35px minmax(115px, 1fr) minmax(138px, .78fr) 66px;
      align-items: center;
      gap: 10px;
      min-height: 68px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .lesson-row.is-current .lesson-title { color: var(--green); }

    .lesson-number {
      color: var(--muted);
      font: 15px var(--serif);
    }

    .lesson-title {
      display: block;
      padding: 4px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font: 400 16px/1.25 var(--serif);
      cursor: pointer;
    }

    .lesson-title:hover { text-decoration: underline; text-underline-offset: 3px; }

    .date-field label { margin-bottom: 2px; }
    .date-field input { min-height: 36px; padding: 5px 7px; font-size: 12px; }

    .done-field {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin: 0;
      color: #555a52;
      font-size: 11px;
      cursor: pointer;
    }

    .done-field input { width: 17px; height: 17px; margin: 0; }

    .focus-panel {
      position: sticky;
      top: 16px;
      min-height: 230px;
      padding: 20px;
      border-left: 2px solid #91a18e;
      background: rgba(255,255,255,.36);
    }

    .focus-kicker {
      margin: 0 0 7px;
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .focus-panel h3 {
      margin: 0;
      font: 400 25px/1.18 var(--serif);
    }

    .focus-date { margin: 7px 0 18px; color: var(--muted); font-size: 12px; }
    .focus-panel h4 { margin: 18px 0 4px; font-size: 11px; font-weight: 700; }
    .focus-panel p:not(.focus-kicker):not(.focus-date) { margin: 0; color: #51564e; font-size: 13px; }

    .empty-state {
      margin-top: 32px;
      padding: 35px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .empty-state h2 { margin: 0; font: 400 26px/1.2 var(--serif); }
    .empty-state p { max-width: 520px; margin: 10px 0 0; color: #62665e; font-size: 13px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      .controls { grid-template-columns: minmax(180px, 1fr) minmax(270px, 1.5fr); }
      .library-tools { grid-column: 1 / -1; justify-self: end; width: min(100%, 340px); }
      .lesson-layout { grid-template-columns: minmax(0, 1fr) minmax(230px, .75fr); gap: 22px; }
      .lesson-row { grid-template-columns: 26px minmax(100px, 1fr) minmax(130px, .9fr) 58px; gap: 7px; }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 32px, 1120px); }
      header { padding: 16px 0; }
      main { padding-top: 32px; }
      .controls { grid-template-columns: 1fr; gap: 13px; }
      .library-tools { grid-column: auto; justify-self: stretch; width: auto; }
      .lesson-layout { grid-template-columns: 1fr; gap: 18px; }
      .focus-panel { position: static; grid-row: 1; min-height: 0; padding: 16px; }
      .lesson-row { grid-template-columns: 25px minmax(0, 1fr) minmax(132px, .78fr); gap: 8px; }
      .done-field { grid-column: 2 / -1; justify-content: flex-start; padding-left: 2px; }
      .workspace-heading { align-items: flex-start; flex-direction: column; gap: 3px; }
    }

    @media (max-width: 390px) {
      .page { width: calc(100% - 24px); }
      .add-fields { grid-template-columns: 1fr; }
      .lesson-row { grid-template-columns: 22px minmax(0, 1fr) minmax(120px, .75fr); gap: 6px; }
      .lesson-title { font-size: 15px; }
      .date-field input { font-size: 11px; }
      .return-link { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="../../index.html" aria-label="Fieldnotes home">
        <span class="brand-mark" aria-hidden="true">f</span> Fieldnotes
      </a>
      <a class="return-link" href="../../index.html">← All designs</a>
    </header>

    <main>
      <p class="eyebrow">Read something. Do something.</p>
      <h1>A week, with intention.</h1>
      <p class="intro">Turn a book into seven small practices, then give each one a day of its own.</p>

      <form class="controls" id="book-form">
        <div>
          <label for="book-title">Book title</label>
          <input id="book-title" name="title" type="text" maxlength="180" placeholder="Add a book to your week" required>
        </div>
        <div class="add-fields">
          <div>
            <label for="start-date">Start date</label>
            <input id="start-date" name="startDate" type="date" required>
          </div>
          <button class="add-button" type="submit">Add to my week</button>
        </div>
        <div class="library-tools" id="library-tools" hidden>
          <div>
            <label for="book-switcher">Your books</label>
            <select id="book-switcher" aria-label="Switch stored book"></select>
          </div>
          <button class="delete-button" id="delete-book" type="button">Delete book</button>
        </div>
      </form>
      <p class="disclosure">Every lesson set is a simulated example, not content extracted from the book.</p>

      <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
      <p class="sr-only" id="error-announcement" role="alert" aria-live="assertive" aria-atomic="true"></p>

      <section id="book-content" aria-live="off"></section>
    </main>
  </div>

  <script type="module">
    import {
      readDatabase,
      createBook,
      updateLessonDate,
      setLessonCompleted,
      deleteBook,
      toLocalDateKey,
    } from "../../scripts/app.mjs";

    const form = document.querySelector("#book-form");
    const titleInput = document.querySelector("#book-title");
    const startDateInput = document.querySelector("#start-date");
    const libraryTools = document.querySelector("#library-tools");
    const bookSwitcher = document.querySelector("#book-switcher");
    const deleteButton = document.querySelector("#delete-book");
    const bookContent = document.querySelector("#book-content");
    const announcement = document.querySelector("#announcement");
    const errorAnnouncement = document.querySelector("#error-announcement");
    let activeBookId = null;
    let activeLessonId = null;

    startDateInput.value = toLocalDateKey(new Date());

    function announce(message) {
      errorAnnouncement.textContent = "";
      announcement.textContent = message;
    }

    function announceError(error) {
      announcement.textContent = "";
      errorAnnouncement.textContent = error instanceof Error ? error.message : "Something went wrong. Please try again.";
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function render() {
      const db = readDatabase();
      const books = db.books;
      if (!books.some((book) => book.id === activeBookId)) activeBookId = books[0]?.id ?? null;
      libraryTools.hidden = books.length === 0;
      bookSwitcher.replaceChildren();
      for (const book of books) {
        const option = document.createElement("option");
        option.value = book.id;
        option.textContent = book.title;
        option.selected = book.id === activeBookId;
        bookSwitcher.append(option);
      }

      const book = books.find((item) => item.id === activeBookId);
      bookContent.replaceChildren();
      if (!book) {
        const empty = makeElement("section", "empty-state");
        empty.setAttribute("aria-labelledby", "empty-heading");
        empty.append(makeElement("h2", "", "Your next good idea starts here."));
        empty.querySelector("h2").id = "empty-heading";
        empty.append(makeElement("p", "", "Add a book title and choose a start date. You’ll get seven consecutive days to work through a set of clearly simulated practice prompts."));
        bookContent.append(empty);
        return;
      }

      const completedCount = book.lessons.filter((lesson) => lesson.completed).length;
      const heading = makeElement("div", "workspace-heading");
      const headingTitle = makeElement("h2", "", book.title);
      headingTitle.id = "week-heading";
      heading.append(headingTitle, makeElement("span", "progress", `${completedCount} of 7 complete`));

      const layout = makeElement("div", "lesson-layout");
      const list = makeElement("ol", "lesson-list");
      list.setAttribute("aria-label", `Seven simulated lessons for ${book.title}`);

      if (!book.lessons.some((lesson) => lesson.id === activeLessonId)) {
        activeLessonId = book.lessons.find((lesson) => !lesson.completed)?.id ?? book.lessons[0]?.id ?? null;
      }

      for (const [index, lesson] of book.lessons.entries()) {
        const row = makeElement("li", `lesson-row${lesson.id === activeLessonId ? " is-current" : ""}`);
        const number = makeElement("span", "lesson-number", String(index + 1).padStart(2, "0"));
        number.setAttribute("aria-hidden", "true");

        const focusButton = makeElement("button", "lesson-title", lesson.title);
        focusButton.type = "button";
        focusButton.dataset.focusKey = "active-lesson";
        focusButton.setAttribute("aria-pressed", String(lesson.id === activeLessonId));
        focusButton.setAttribute("aria-label", `Show lesson ${index + 1}: ${lesson.title}`);
        focusButton.addEventListener("click", () => {
          activeLessonId = lesson.id;
          render();
        });

        const dateField = makeElement("div", "date-field");
        const dateLabel = makeElement("label", "", `Day ${index + 1} date`);
        const dateInput = document.createElement("input");
        dateInput.type = "date";
        dateInput.value = lesson.date ?? "";
        dateInput.required = true;
        dateInput.dataset.focusKey = `date-${lesson.id}`;
        dateLabel.htmlFor = `date-${lesson.id}`;
        dateInput.id = `date-${lesson.id}`;
        dateInput.addEventListener("change", () => {
          try {
            updateLessonDate(book.id, lesson.id, dateInput.value);
            announce(`Lesson ${index + 1} moved to ${dateInput.value}.`);
            renderAndRestoreFocus(dateInput.dataset.focusKey);
          } catch (error) {
            announceError(error);
            renderAndRestoreFocus(dateInput.dataset.focusKey);
          }
        });
        dateField.append(dateLabel, dateInput);

        const doneLabel = makeElement("label", "done-field");
        const doneInput = document.createElement("input");
        doneInput.type = "checkbox";
        doneInput.checked = lesson.completed;
        doneInput.dataset.focusKey = `done-${lesson.id}`;
        doneInput.setAttribute("aria-label", `Mark lesson ${index + 1} ${lesson.title} complete`);
        doneInput.addEventListener("change", () => {
          try {
            setLessonCompleted(book.id, lesson.id, doneInput.checked);
            announce(doneInput.checked ? `Lesson ${index + 1} marked complete.` : `Lesson ${index + 1} marked incomplete.`);
            renderAndRestoreFocus(doneInput.dataset.focusKey);
          } catch (error) {
            announceError(error);
            renderAndRestoreFocus(doneInput.dataset.focusKey);
          }
        });
        doneLabel.append(doneInput, document.createTextNode("Done"));
        row.append(number, focusButton, dateField, doneLabel);
        list.append(row);
      }

      const selectedLesson = book.lessons.find((lesson) => lesson.id === activeLessonId);
      const focus = makeElement("article", "focus-panel");
      focus.setAttribute("aria-labelledby", "focus-title");
      focus.append(makeElement("p", "focus-kicker", `Lesson ${book.lessons.indexOf(selectedLesson) + 1} · simulated example`));
      const focusTitle = makeElement("h3", "", selectedLesson?.title ?? "Your lesson");
      focusTitle.id = "focus-title";
      focus.append(focusTitle);
      if (selectedLesson) {
        const date = selectedLesson.date ? new Date(`${selectedLesson.date}T12:00:00`) : null;
        focus.append(makeElement("p", "focus-date", date ? date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) : "No date scheduled"));
        focus.append(makeElement("h4", "", "Try this"));
        focus.append(makeElement("p", "", selectedLesson.action));
        focus.append(makeElement("h4", "", "Reflect"));
        focus.append(makeElement("p", "", selectedLesson.reflection));
      }

      layout.append(list, focus);
      bookContent.append(heading, layout);
    }

    function renderAndRestoreFocus(focusKey) {
      render();
      const target = [...document.querySelectorAll("[data-focus-key]")].find((element) => element.dataset.focusKey === focusKey);
      target?.focus({ preventScroll: true });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      try {
        const book = createBook(titleInput.value, startDateInput.value);
        activeBookId = book.id;
        activeLessonId = book.lessons[0]?.id ?? null;
        titleInput.value = "";
        announce(`Added ${book.title} with seven simulated lessons, starting ${book.startDate}.`);
        render();
        titleInput.focus();
      } catch (error) {
        announceError(error);
        titleInput.focus();
      }
    });

    bookSwitcher.addEventListener("change", () => {
      activeBookId = bookSwitcher.value;
      activeLessonId = null;
      const book = readDatabase().books.find((item) => item.id === activeBookId);
      announce(book ? `Showing ${book.title}.` : "Book selected.");
      render();
    });

    deleteButton.addEventListener("click", () => {
      const book = readDatabase().books.find((item) => item.id === activeBookId);
      if (!book) return;
      try {
        deleteBook(book.id);
        activeBookId = null;
        activeLessonId = null;
        announce(`Deleted ${book.title}.`);
        render();
      } catch (error) {
        announceError(error);
      }
    });

    window.addEventListener("storage", render);
    render();
  </script>
</body>
</html>
